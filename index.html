<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>生日快乐 · 陈桑</title>
<meta name="description" content="陈桑，11.7 生日快乐 🎂 吹蜡烛、拆礼物、还有一份要自己刮开的祝福">
<meta property="og:title" content="生日快乐 · 陈桑">
<meta property="og:description" content="11.7 生日快乐 🎂 吹蜡烛、拆礼物，还有一份要自己刮开的祝福">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎂</text></svg>">
<style>
  :root{
    --pink:#ff7aa8;
    --pink-soft:#ffd0e0;
    --gold:#ffd76e;
    --deep:#160b22;
    --deep2:#2a1038;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{
    background:radial-gradient(120% 90% at 50% 0%,#3d1552 0%,var(--deep2) 38%,var(--deep) 100%);
    color:#fff;
    font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,-apple-system,sans-serif;
    overflow:hidden;
    user-select:none;
  }
  /* 背景星空 */
  #stars{position:fixed;inset:0;pointer-events:none;opacity:.7}
  .star{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;animation:tw 3s ease-in-out infinite}
  @keyframes tw{0%,100%{opacity:.15;transform:scale(.8)}50%{opacity:.95;transform:scale(1.3)}}

  #fx{position:fixed;inset:0;pointer-events:none;z-index:50}

  /* 场景容器 */
  .scene{
    position:fixed;inset:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:24px;
    opacity:0;visibility:hidden;transform:scale(.94);
    transition:opacity .7s ease,transform .7s cubic-bezier(.2,.9,.3,1),visibility .7s;
    text-align:center;
  }
  .scene.active{opacity:1;visibility:visible;transform:scale(1)}

  h1{font-size:clamp(28px,7vw,54px);margin:0 0 6px;letter-spacing:2px;
     background:linear-gradient(100deg,#fff,var(--pink-soft) 40%,var(--gold));
     -webkit-background-clip:text;background-clip:text;color:transparent;
     text-shadow:0 0 40px rgba(255,150,190,.35)}
  h2{font-size:clamp(20px,5vw,30px);margin:0 0 14px;font-weight:600}
  p{line-height:1.9;color:#f6e6f2;font-size:clamp(14px,3.6vw,17px);margin:8px 0}
  .dim{color:#c9a8d8;font-size:13px;letter-spacing:1px}

  .btn{
    margin-top:26px;
    padding:14px 34px;border:none;border-radius:999px;cursor:pointer;
    font-size:16px;font-weight:600;letter-spacing:1px;color:#4a0f2c;
    background:linear-gradient(120deg,#ffe3ee,#ffb6d0 50%,#ffd76e);
    box-shadow:0 10px 30px rgba(255,120,170,.35),inset 0 0 0 1px rgba(255,255,255,.6);
    transition:transform .18s ease,box-shadow .18s ease;
  }
  .btn:hover{transform:translateY(-2px) scale(1.03);box-shadow:0 14px 38px rgba(255,120,170,.5)}
  .btn:active{transform:scale(.97)}
  .btn.ghost{
    background:rgba(255,255,255,.08);color:#ffd9e8;font-weight:500;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.28);
  }

  /* ---------- 封面 ---------- */
  .date-badge{
    font-size:clamp(44px,14vw,96px);font-weight:800;letter-spacing:4px;line-height:1;
    color:#fff;
    text-shadow:0 0 18px rgba(255,150,190,.9),0 0 60px rgba(255,110,170,.6);
    animation:pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
  .heart-beat{display:inline-block;animation:beat 1.1s ease-in-out infinite}
  @keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}

  /* ---------- 蛋糕 ---------- */
  .cake-wrap{position:relative;margin:18px 0 6px;perspective:800px}
  .cake{position:relative;width:220px}
  .layer{border-radius:14px;margin:0 auto;box-shadow:inset 0 -10px 22px rgba(0,0,0,.25),0 8px 24px rgba(0,0,0,.35)}
  .layer-1{width:220px;height:62px;background:linear-gradient(180deg,#ffd9a8,#f7a86a)}
  .layer-2{width:172px;height:52px;background:linear-gradient(180deg,#ffc7dd,#ef8bb4);margin-top:-6px}
  .layer-3{width:124px;height:44px;background:linear-gradient(180deg,#fff0c9,#f7c95e);margin-top:-6px}
  .icing{position:absolute;left:0;right:0;height:14px;border-radius:14px 14px 0 0;background:rgba(255,255,255,.85)}
  .icing.l1{top:0;width:220px;background:linear-gradient(180deg,#fff,#ffe6f0)}
  .icing-drip{position:absolute;top:10px;width:14px;height:16px;border-radius:0 0 10px 10px;background:#fff}
  .plate{width:260px;height:14px;border-radius:50%;margin:-4px auto 0;
    background:radial-gradient(ellipse at 50% 30%,#f6e9ff,#b79ad6 60%,#7c5c9e);
    box-shadow:0 12px 30px rgba(0,0,0,.45)}
  .candles{position:absolute;top:-58px;left:0;right:0;display:flex;justify-content:center;gap:26px;height:58px}
  .candle{position:relative;width:12px;height:52px;cursor:pointer;transition:transform .15s}
  .candle:hover{transform:translateY(-2px)}
  .candle .stick{position:absolute;inset:0;border-radius:6px;
    background:repeating-linear-gradient(45deg,#fff 0 6px,#ff8fb8 6px 12px);
    box-shadow:inset -3px 0 6px rgba(0,0,0,.2)}
  .candle .wick{position:absolute;top:-5px;left:50%;transform:translateX(-50%);width:2px;height:6px;background:#3a2b22;border-radius:2px}
  .flame{
    position:absolute;top:-24px;left:50%;transform:translateX(-50%) scale(1);
    width:14px;height:24px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;
    background:radial-gradient(circle at 50% 70%,#fff 0 18%,#ffe066 40%,#ff9d2e 70%,rgba(255,90,0,.15) 100%);
    box-shadow:0 0 18px 6px rgba(255,170,60,.75),0 0 60px 18px rgba(255,120,0,.35);
    animation:flicker .28s ease-in-out infinite alternate;
    transform-origin:50% 100%;
    opacity:1;transition:opacity .25s,transform .25s;
  }
  @keyframes flicker{
    0%{transform:translateX(-50%) scale(1) rotate(-3deg)}
    100%{transform:translateX(-50%) scale(1.12,.92) rotate(3deg)}
  }
  .candle.out .flame{opacity:0;transform:translateX(-50%) scale(.2);animation:none}
  .smoke{
    position:absolute;top:-26px;left:50%;width:8px;height:8px;border-radius:50%;
    background:rgba(220,220,230,.6);filter:blur(3px);pointer-events:none;
    animation:smoke 1.6s ease-out forwards;
  }
  @keyframes smoke{0%{opacity:.85;transform:translate(-50%,0) scale(.6)}100%{opacity:0;transform:translate(-50%,-70px) scale(2.6)}}
  .wish-hint{margin-top:18px;min-height:28px;font-size:15px;color:#ffd9e8;letter-spacing:1px}
  .glow-text{animation:glow 1.6s ease-in-out infinite alternate}
  @keyframes glow{from{text-shadow:0 0 6px rgba(255,200,230,.4)}to{text-shadow:0 0 22px rgba(255,180,220,.95)}}

  /* ---------- 礼物盒 ---------- */
  .gift{position:relative;width:190px;height:170px;margin:26px 0 10px;cursor:pointer}
  .gift .box{
    position:absolute;bottom:0;left:10px;width:170px;height:120px;border-radius:8px;
    background:linear-gradient(160deg,#ff8fb8,#e0457f);
    box-shadow:inset 0 -14px 30px rgba(0,0,0,.25),0 16px 40px rgba(0,0,0,.45);
  }
  .gift .ribbon-v{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:26px;height:120px;
    background:linear-gradient(90deg,#ffe9a8,#ffd76e,#f0b93c)}
  .gift .lid{
    position:absolute;top:26px;left:0;width:190px;height:36px;border-radius:8px;
    background:linear-gradient(160deg,#ffa8c9,#e8628f);
    box-shadow:0 8px 20px rgba(0,0,0,.4);
    transition:transform 1s cubic-bezier(.3,1.4,.5,1),opacity .8s;
    transform-origin:80% 100%;
  }
  .gift .bow{position:absolute;top:4px;left:50%;transform:translateX(-50%);width:56px;height:28px}
  .gift .bow::before,.gift .bow::after{
    content:"";position:absolute;top:0;width:26px;height:26px;border-radius:50% 50% 50% 10%;
    background:linear-gradient(140deg,#ffe9a8,#ffd76e);box-shadow:0 3px 10px rgba(0,0,0,.3)
  }
  .gift .bow::before{left:0;transform:rotate(-18deg)}
  .gift .bow::after{right:0;transform:rotate(18deg) scaleX(-1)}
  .gift:hover .box{filter:brightness(1.06)}
  .gift.open .lid{transform:translate(60px,-120px) rotate(38deg);opacity:0}
  .gift.open .box{animation:giftPop .5s ease}
  @keyframes giftPop{0%{transform:scale(1)}40%{transform:scale(1.08)}100%{transform:scale(1)}}
  .shake{animation:shake .5s ease-in-out infinite}
  @keyframes shake{0%,100%{transform:translateX(0) rotate(0)}25%{transform:translateX(-5px) rotate(-2deg)}75%{transform:translateX(5px) rotate(2deg)}}

  /* ---------- 祝福揭晓 ---------- */
  .bless-card{
    position:relative;width:min(90vw,470px);
    border-radius:22px;padding:30px 26px 24px;
    background:linear-gradient(150deg,#fff7fb,#ffe3ee 60%,#ffeccd);
    box-shadow:0 24px 60px rgba(0,0,0,.5),inset 0 0 0 2px rgba(255,255,255,.6);
    text-align:center;overflow:hidden;
  }
  .bless-card::before{
    content:"";position:absolute;top:-90px;right:-90px;width:220px;height:220px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,180,215,.6),transparent 70%);
  }
  .bless-card::after{
    content:"";position:absolute;bottom:-70px;left:-70px;width:170px;height:170px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,215,110,.5),transparent 70%);
  }
  .bless-card h3{
    margin:0 0 18px;font-size:clamp(18px,4.8vw,24px);letter-spacing:1px;
    color:#c02a68;position:relative;
  }
  .bless-line{
    color:#8a3b60;font-size:clamp(13.5px,3.7vw,16px);line-height:2;margin:14px 0;
    position:relative;
    opacity:0;transform:translateY(16px);
    animation:lineIn .9s cubic-bezier(.2,.9,.3,1) forwards;
  }
  @keyframes lineIn{to{opacity:1;transform:translateY(0)}}
  .bless-card .seal{
    margin-top:22px;padding-top:16px;border-top:1px dashed rgba(192,42,104,.28);
    color:#c98bb0;font-size:13px;letter-spacing:3px;position:relative;
    opacity:0;transform:translateY(16px);
    animation:lineIn .9s cubic-bezier(.2,.9,.3,1) forwards;
  }

  /* ---------- 结尾定格 ---------- */
  #finale{
    position:fixed;inset:0;z-index:70;display:none;
    flex-direction:column;align-items:center;justify-content:center;
    background:radial-gradient(70% 60% at 50% 45%,rgba(120,20,70,.72),rgba(22,11,34,.92));
    backdrop-filter:blur(6px);
  }
  #finale.show{display:flex;animation:fadeIn .8s ease}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  #finale .big{
    font-size:clamp(34px,10vw,72px);font-weight:800;letter-spacing:3px;line-height:1.2;
    background:linear-gradient(100deg,#fff,var(--pink-soft) 45%,var(--gold));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    animation:pulse 2.2s ease-in-out infinite;
    filter:drop-shadow(0 0 26px rgba(255,140,190,.75));
  }
  #finale .sub{margin-top:18px;color:#ffd9e8;letter-spacing:6px;font-size:clamp(14px,4vw,20px)}
  #finale .again{margin-top:34px}

  .ui-top{position:fixed;top:14px;right:14px;z-index:60;display:flex;gap:8px}
  .icon-btn{
    width:42px;height:42px;border-radius:50%;border:none;cursor:pointer;font-size:18px;
    background:rgba(255,255,255,.1);color:#fff;backdrop-filter:blur(8px);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.2);transition:transform .15s,background .2s
  }
  .icon-btn:hover{background:rgba(255,255,255,.2);transform:scale(1.06)}
  .ui-bottom{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:60;display:flex;gap:10px;align-items:center}
  .dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.25);transition:all .3s}
  .dot.on{background:#ffb6d0;width:22px;border-radius:99px;box-shadow:0 0 12px rgba(255,150,190,.8)}

  .toast{
    position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);
    background:rgba(0,0,0,.65);backdrop-filter:blur(10px);color:#fff;padding:10px 20px;border-radius:99px;
    font-size:14px;opacity:0;pointer-events:none;transition:all .35s;z-index:80;white-space:nowrap
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  @media (max-width:420px){
    .cake{width:180px}
    .layer-1{width:180px;height:54px}
    .layer-2{width:142px;height:46px}
    .layer-3{width:104px;height:38px}
    .plate{width:214px}
    .candles{gap:18px}
  }
</style>
</head>
<body>
<div id="stars"></div>
<canvas id="fx"></canvas>

<div class="ui-top">
  <button class="icon-btn" id="musicBtn" title="音乐开关">♪</button>
  <button class="icon-btn" id="micBtn" title="用嘴吹蜡烛（需要麦克风）">🎤</button>
  <button class="icon-btn" id="replayBtn" title="从头再来">↺</button>
</div>

<!-- ========== 1. 封面 ========== -->
<section class="scene active" id="s1">
  <p class="dim">🎂 A LITTLE SOMETHING FOR YOU</p>
  <div class="date-badge">11.7</div>
  <h1>陈桑，生日快乐</h1>
  <p>这是一个只属于你的小页面<br>里面有蛋糕、有礼物、还有一点藏起来的话</p>
  <button class="btn" data-go="s2">点我开始 <span class="heart-beat">❤</span></button>
</section>

<!-- ========== 2. 蛋糕 ========== -->
<section class="scene" id="s2">
  <h2>先许个愿吧</h2>
  <p class="dim">闭上眼睛想一个愿望 —— 然后吹灭蜡烛</p>
  <div class="cake-wrap">
    <div class="cake">
      <div class="candles" id="candles"></div>
      <div class="layer layer-3" style="position:relative"></div>
      <div class="layer layer-2"></div>
      <div class="layer layer-1"></div>
      <div class="plate"></div>
    </div>
  </div>
  <div class="wish-hint" id="wishHint">👆 点一下蜡烛，或者点右上角 🎤 用嘴吹</div>
  <button class="btn" data-go="s3" id="cakeNext" style="display:none">还有惊喜 →</button>
</section>

<!-- ========== 3. 礼物盒 ========== -->
<section class="scene" id="s3">
  <h2>送你的礼物</h2>
  <p class="dim">拆开看看里面装了什么</p>
  <div class="gift" id="gift">
    <div class="box"><div class="ribbon-v"></div></div>
    <div class="lid"><div class="bow"></div></div>
  </div>
  <p id="giftTip">👆 点一下礼物盒</p>
  <button class="btn" data-go="s4" id="giftNext" style="display:none">看看写了什么 →</button>
</section>

<!-- ========== 4. 祝福揭晓 ========== -->
<section class="scene" id="s4">
  <h2>🎁 拆开啦</h2>
  <div class="bless-card" id="blessCard"></div>
  <button class="btn" id="blessNext" style="display:none">🎉 生日快乐，陈桑</button>
</section>

<!-- ========== 5. 结尾定格 ========== -->
<div id="finale">
  <div class="big">生日快乐<br>陈桑</div>
  <div class="sub">11.7</div>
  <button class="btn again" id="againBtn">再看一遍 ↺</button>
</div>

<div class="ui-bottom" id="dots"></div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================
   ①  改这里就行 —— 所有文案都在这个配置里
   ========================================================= */
const CONFIG = {
  name: '陈桑',                       // 她的名字/昵称
  date: '11.7',                       // 生日日期
  // 拆开礼物后逐条浮现的祝福（想加几行就加几行）
  blessingLines: [
    '愿你今年所有的愿望，都像今天的蜡烛一样，被一口气全部实现。',
    '愿你被生活温柔对待，也被我偷偷偏爱。',
    '愿你的每一天都不被辜负 —— 尤其是今天。'
  ],
  // 结尾定格的文案由页面里的 #finale 控制（不用改这里）
  // 蜡烛数量
  candleCount: 3
};

/* =========================================================
   ②  星空背景
   ========================================================= */
(function stars(){
  const box = document.getElementById('stars');
  const n = 90, frag = document.createDocumentFragment();
  for (let i = 0; i < n; i++){
    const s = document.createElement('div');
    s.className = 'star';
    s.style.left = Math.random()*100 + '%';
    s.style.top  = Math.random()*100 + '%';
    s.style.animationDelay = (Math.random()*3).toFixed(2) + 's';
    const sz = (Math.random()*2 + 1).toFixed(1);
    s.style.width = sz + 'px'; s.style.height = sz + 'px';
    frag.appendChild(s);
  }
  box.appendChild(frag);
})();

/* =========================================================
   ③  粒子引擎（烟花 / 爱心雨 / 彩带）
   ========================================================= */
const fx = document.getElementById('fx');
const fctx = fx.getContext('2d');
let W = 0, H = 0, DPR = Math.min(window.devicePixelRatio || 1, 2);
function resizeFx(){
  W = window.innerWidth; H = window.innerHeight;
  fx.width = W * DPR; fx.height = H * DPR;
  fx.style.width = W + 'px'; fx.style.height = H + 'px';
  fctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
resizeFx();
window.addEventListener('resize', resizeFx);

const parts = [];
const HEART_COLORS = ['#ff7aa8','#ffb6d0','#ffd76e','#ff5c8d','#fff0c9','#ff9ec4'];

function addSpark(x, y, color, speed, life, size){
  parts.push({ x, y, vx: Math.cos(speed)* (2+Math.random()*4), vy: Math.sin(speed)*(2+Math.random()*4) - 1,
    life: life || 1, decay: .012 + Math.random()*.018, color, size: size || (1.5+Math.random()*2.4), kind:'spark', rot:0, vr:0 });
}
function burst(x, y, count, colors){
  const cs = colors || HEART_COLORS;
  for (let i = 0; i < (count || 70); i++){
    addSpark(x, y, cs[i % cs.length], Math.random()*Math.PI*2, 1, 1.4 + Math.random()*2.6);
  }
}
function heartBurst(x, y, count){
  for (let i = 0; i < (count || 26); i++){
    parts.push({
      x, y, vx: (Math.random()-.5)*4, vy: -2 - Math.random()*5,
      life: 1, decay: .006 + Math.random()*.006,
      color: HEART_COLORS[i % HEART_COLORS.length],
      size: 12 + Math.random()*16, kind:'heart',
      rot: (Math.random()-.5)*.6, vr: (Math.random()-.5)*.06
    });
  }
}
function heartRain(duration){
  const t0 = performance.now();
  const timer = setInterval(() => {
    if (performance.now() - t0 > duration){ clearInterval(timer); return; }
    parts.push({
      x: Math.random()*W, y: -30, vx: (Math.random()-.5)*1.2, vy: 1 + Math.random()*2.2,
      life: 1, decay: .0035, color: HEART_COLORS[(Math.random()*HEART_COLORS.length)|0],
      size: 10 + Math.random()*18, kind:'heart',
      rot: (Math.random()-.5)*.5, vr: (Math.random()-.5)*.04
    });
  }, 90);
}
function confetti(count){
  for (let i = 0; i < (count||120); i++){
    parts.push({
      x: Math.random()*W, y: -20 - Math.random()*H*.3,
      vx: (Math.random()-.5)*2.4, vy: 1.6 + Math.random()*3.4,
      life: 1, decay: .0035, color: HEART_COLORS[(Math.random()*HEART_COLORS.length)|0],
      size: 4 + Math.random()*6, kind:'confetti',
      rot: Math.random()*Math.PI, vr: (Math.random()-.5)*.3
    });
  }
}
function fireworkShow(times){
  let i = 0;
  const t = setInterval(() => {
    if (i++ >= (times||6)){ clearInterval(t); return; }
    burst(W*(.12 + Math.random()*.76), H*(.14 + Math.random()*.42), 80);
  }, 260);
}

function fxLoop(){
  fctx.clearRect(0, 0, W, H);
  for (let i = parts.length - 1; i >= 0; i--){
    const p = parts[i];
    p.x += p.vx; p.y += p.vy;
    p.vy += (p.kind === 'heart' ? .018 : .055);
    p.vx *= .985; p.vy *= .988;
    p.rot += p.vr || 0;
    p.life -= p.decay;
    if (p.life <= 0 || p.y > H + 80){ parts.splice(i, 1); continue; }
    fctx.globalAlpha = Math.max(0, Math.min(1, p.life));
    if (p.kind === 'heart'){
      fctx.save();
      fctx.translate(p.x, p.y); fctx.rotate(p.rot);
      fctx.font = p.size + 'px serif';
      fctx.textAlign = 'center'; fctx.textBaseline = 'middle';
      fctx.fillStyle = p.color;
      fctx.shadowColor = p.color; fctx.shadowBlur = 14;
      fctx.fillText('❤', 0, 0);
      fctx.restore();
    } else if (p.kind === 'confetti'){
      fctx.save();
      fctx.translate(p.x, p.y); fctx.rotate(p.rot);
      fctx.fillStyle = p.color;
      fctx.fillRect(-p.size/2, -p.size/4, p.size, p.size/2);
      fctx.restore();
    } else {
      fctx.fillStyle = p.color;
      fctx.shadowColor = p.color; fctx.shadowBlur = 12;
      fctx.beginPath();
      fctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI*2);
      fctx.fill();
      fctx.shadowBlur = 0;
    }
  }
  fctx.globalAlpha = 1;
  requestAnimationFrame(fxLoop);
}
fxLoop();

/* =========================================================
   ④  场景切换
   ========================================================= */
const SCENES = ['s1','s2','s3','s4'];
const dotsBox = document.getElementById('dots');
SCENES.forEach((id, i) => {
  const d = document.createElement('div');
  d.className = 'dot' + (i === 0 ? ' on' : '');
  d.dataset.i = i;
  dotsBox.appendChild(d);
});
function go(id){
  document.querySelectorAll('.scene').forEach(s => s.classList.toggle('active', s.id === id));
  const i = SCENES.indexOf(id);
  document.querySelectorAll('.dot').forEach((d, k) => d.classList.toggle('on', k === i));
  if (id === 's4') revealBlessing();
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-go]');
  if (b) go(b.dataset.go);
});

function toast(msg, ms){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), ms || 2200);
}

/* =========================================================
   ⑤  蛋糕 + 蜡烛
   ========================================================= */
const candlesBox = document.getElementById('candles');
let litCount = CONFIG.candleCount, celebrated = false;
for (let i = 0; i < CONFIG.candleCount; i++){
  const c = document.createElement('div');
  c.className = 'candle';
  c.innerHTML = '<div class="flame"></div><div class="wick"></div><div class="stick"></div>';
  c.addEventListener('click', () => blowOne(c));
  candlesBox.appendChild(c);
}
function blowOne(candle){
  if (candle.classList.contains('out')) return;
  candle.classList.add('out');
  const smoke = document.createElement('div');
  smoke.className = 'smoke';
  candle.appendChild(smoke);
  setTimeout(() => smoke.remove(), 1700);
  const r = candle.getBoundingClientRect();
  burst(r.left + r.width/2, r.top - 6, 14, ['#cfc6dd','#efe6ff','#9c8fb5']);
  litCount--;
  if (litCount === 0) celebrateCake();
}
function celebrateCake(){
  if (celebrated) return;
  celebrated = true;
  const hint = document.getElementById('wishHint');
  hint.innerHTML = '<span class="glow-text">愿望已经收到了 ✨ 生日快乐，' + CONFIG.name + '！</span>';
  fireworkShow(8);
  heartRain(3200);
  setTimeout(() => { document.getElementById('cakeNext').style.display = ''; }, 1600);
}
function blowAllCandles(){
  document.querySelectorAll('.candle').forEach((c, i) => setTimeout(() => blowOne(c), i*180));
}

/* ---------- 麦克风吹气检测 ---------- */
let micStream = null, micCtx = null, micRAF = null, micActive = false;
document.getElementById('micBtn').addEventListener('click', async () => {
  if (micActive){ stopMic(); return; }
  if (celebrated){ toast('蜡烛已经吹灭啦～'); return; }
  try{
    micStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation:false, noiseSuppression:false, autoGainControl:false } });
  }catch(err){
    toast('麦克风用不了，直接点蜡烛吧 👆', 2600);
    return;
  }
  micCtx = new (window.AudioContext || window.webkitAudioContext)();
  const src = micCtx.createMediaStreamSource(micStream);
  const an = micCtx.createAnalyser();
  an.fftSize = 1024; an.smoothingTimeConstant = .6;
  src.connect(an);
  const data = new Uint8Array(an.fftSize);
  micActive = true;
  document.getElementById('micBtn').style.background = 'rgba(255,120,170,.55)';
  toast('对着麦克风吹气 💨', 2600);
  const tick = () => {
    if (!micActive) return;
    an.getByteTimeDomainData(data);
    let sum = 0;
    for (let i = 0; i < data.length; i++){ const v = (data[i]-128)/128; sum += v*v; }
    const rms = Math.sqrt(sum/data.length);
    if (rms > .18){             // 吹气音量阈值，可按环境调
      blowAllCandles();
      stopMic();
      return;
    }
    micRAF = requestAnimationFrame(tick);
  };
  tick();
});
function stopMic(){
  micActive = false;
  if (micRAF) cancelAnimationFrame(micRAF);
  if (micStream) micStream.getTracks().forEach(t => t.stop());
  if (micCtx) micCtx.close();
  micStream = micCtx = null;
  document.getElementById('micBtn').style.background = '';
}

/* =========================================================
   ⑥  礼物盒
   ========================================================= */
const gift = document.getElementById('gift');
let giftOpened = false;
gift.classList.add('shake');
gift.addEventListener('click', () => {
  if (giftOpened) return;
  giftOpened = true;
  gift.classList.remove('shake');
  gift.classList.add('open');
  const r = gift.getBoundingClientRect();
  burst(r.left + r.width/2, r.top + r.height*.35, 110);
  confetti(80);
  document.getElementById('giftTip').innerHTML = '是一份写给你的祝福 🎁';
  setTimeout(() => { document.getElementById('giftNext').style.display = ''; }, 900);
});

/* =========================================================
   ⑦  祝福揭晓（拆开礼物后逐条浮现）
   ========================================================= */
let blessingShown = false;
function revealBlessing(){
  if (blessingShown) return;
  blessingShown = true;

  const step = 0.6;                       // 每条之间间隔（秒）
  const lines = CONFIG.blessingLines
    .map((l, i) => '<p class="bless-line" style="animation-delay:' + ((i + 1) * step).toFixed(2) + 's">' + l + '</p>')
    .join('');
  const sealDelay = ((CONFIG.blessingLines.length + 1) * step).toFixed(2);

  document.getElementById('blessCard').innerHTML =
    '<h3>给 ' + CONFIG.name + ' 的话</h3>' +
    lines +
    '<div class="seal" style="animation-delay:' + sealDelay + 's">—— 生日快乐，' + CONFIG.date + ' ——</div>';

  // 逐条浮现时飘落爱心
  const total = (Number(sealDelay) + 0.8) * 1000;
  heartRain(Math.min(7000, total));
  setTimeout(() => heartBurst(window.innerWidth / 2, window.innerHeight * 0.62, 24), total - 700);
  setTimeout(() => { document.getElementById('blessNext').style.display = ''; }, total);
}

/* =========================================================
   ⑧  结尾定格
   ========================================================= */
function finale(){
  const el = document.getElementById('finale');
  el.classList.add('show');
  fireworkShow(12);
  heartRain(5000);
  confetti(180);
  setTimeout(() => heartBurst(window.innerWidth/2, window.innerHeight/2, 50), 900);
}
document.getElementById('blessNext').addEventListener('click', finale);
document.getElementById('againBtn').addEventListener('click', () => location.reload());

/* =========================================================
   ⑨  背景音乐：生日歌（用 WebAudio 合成，无需外部音频文件）
   ========================================================= */
let bgPlaying = false, bgCtx = null, bgTimer = null;
const N = { G4:392.00, A4:440.00, B4:493.88, C5:523.25, D5:587.33, E5:659.25, F5:698.46, G5:783.99 };
const MELODY = [
  [N.G4,.75],[N.G4,.25],[N.A4,1],[N.G4,1],[N.C5,1],[N.B4,2],
  [N.G4,.75],[N.G4,.25],[N.A4,1],[N.G4,1],[N.D5,1],[N.C5,2],
  [N.G4,.75],[N.G4,.25],[N.G5,1],[N.E5,1],[N.C5,1],[N.B4,1],[N.A4,2],
  [N.F5,.75],[N.F5,.25],[N.E5,1],[N.C5,1],[N.D5,1],[N.C5,2]
];
const BEAT = 0.42;   // 一拍时长（秒）

function playSong(){
  if (!bgCtx) bgCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (bgCtx.state === 'suspended') bgCtx.resume();
  const master = bgCtx.createGain();
  master.gain.value = 0.16;
  master.connect(bgCtx.destination);

  let t = bgCtx.currentTime + 0.15;
  MELODY.forEach(([f, beats]) => {
    const dur = beats * BEAT;
    // 主旋律
    const osc = bgCtx.createOscillator();
    const g = bgCtx.createGain();
    osc.type = 'triangle';
    osc.frequency.value = f;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(1, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur * 0.95);
    osc.connect(g); g.connect(master);
    osc.start(t); osc.stop(t + dur);
    // 轻和声，听起来更温柔
    const o2 = bgCtx.createOscillator(), g2 = bgCtx.createGain();
    o2.type = 'sine'; o2.frequency.value = f/2;
    g2.gain.setValueAtTime(0, t);
    g2.gain.linearRampToValueAtTime(.35, t + 0.03);
    g2.gain.exponentialRampToValueAtTime(.001, t + dur);
    o2.connect(g2); g2.connect(master);
    o2.start(t); o2.stop(t + dur);
    t += dur;
  });
  const total = (t - bgCtx.currentTime) * 1000 + 700;
  bgTimer = setTimeout(() => { if (bgPlaying) playSong(); }, total);
}
function stopSong(){
  bgPlaying = false;
  clearTimeout(bgTimer);
  if (bgCtx) bgCtx.close();
  bgCtx = null;
}
document.getElementById('musicBtn').addEventListener('click', () => {
  if (bgPlaying){ stopSong(); document.getElementById('musicBtn').style.background = ''; toast('音乐已暂停'); }
  else { bgPlaying = true; playSong(); document.getElementById('musicBtn').style.background = 'rgba(255,120,170,.55)'; toast('♪ 生日快乐歌'); }
});

/* =========================================================
   ⑩  重播 & 首屏交互
   ========================================================= */
document.getElementById('replayBtn').addEventListener('click', () => location.reload());

// 第一次点击任意处时，顺手把音频上下文解锁
window.addEventListener('pointerdown', function unlock(){
  if (!bgCtx) bgCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (bgCtx.state === 'suspended') bgCtx.resume();
  window.removeEventListener('pointerdown', unlock);
}, { once: true });

// 进场时飘一点爱心
setTimeout(() => heartBurst(window.innerWidth/2, window.innerHeight*0.72, 16), 600);
</script>
